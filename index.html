<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Student Selector</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:3px;background:transparent}#app{width:100%;max-width:280px;border:1px solid #aaa;border-radius:9px;padding:5px;background:#fff;color:#171717}button,select,textarea{font:inherit}.bar{display:grid;grid-template-columns:58px 1fr 26px;gap:3px}.bar select,.bar button{height:27px;padding:2px;border-radius:6px;border:1px solid #aaa}.gear{font-size:16px}.name{margin:4px 0;background:#7b001c;color:#fff;border-radius:7px;min-height:38px;padding:6px 3px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:18px;line-height:1.05}.pick{width:100%;height:31px;border:0;border-radius:7px;background:#7b001c;color:#fff;font-weight:850}.foot{margin-top:3px;display:flex;align-items:center;justify-content:space-between;gap:3px;font-size:10px}.foot button{padding:3px 5px;border-radius:5px;border:1px solid #aaa}.panel{margin-top:5px;border-top:1px solid #bbb;padding-top:5px}.hidden{display:none}.tabs{display:flex;gap:3px;margin-bottom:5px}.tabs button{flex:1;padding:5px}.roster textarea{width:100%;min-height:115px;border:1px solid #aaa;border-radius:6px;padding:5px;font-size:12px}.attendance{max-height:48vh;overflow:auto}.attendance label{display:block;font-size:12px;padding:4px;border-bottom:1px solid #ddd}.done{width:100%;margin-top:5px;padding:7px;background:#7b001c;color:#fff;border:0;border-radius:6px;font-weight:700}.note{font-size:10px;opacity:.75;margin:4px 0}@media(max-width:220px){body{padding:1px}#app{padding:3px;border-radius:6px}.bar{grid-template-columns:49px 1fr 24px}.name{font-size:15px;min-height:31px;padding:3px}.pick{height:28px;font-size:12px}.foot{font-size:9px}.foot button{padding:2px 3px}}@media(prefers-color-scheme:dark){#app{background:#181818;color:#eee}.bar select,.bar button,.foot button,textarea{background:#282828;color:#eee;border-color:#555}.attendance label{border-color:#444}}
</style></head><body><main id="app"><div class="bar"><select id="period" aria-label="Period"><option value="1">P1</option><option value="2">P2</option><option value="3">P3</option><option value="4">P4</option><option value="5">P5</option></select><div></div><button id="settings" class="gear" aria-label="Attendance and roster">☰</button></div><div id="name" class="name" aria-live="polite">Ready</div><button id="pick" class="pick">PICK</button><div class="foot"><span id="stats">No roster</span><span><button id="undo">Undo</button><button id="attBtn">Attendance</button></span></div><section id="panel" class="panel hidden"><div class="tabs"><button id="attTab">Attendance</button><button id="rosterTab">Rosters</button></div><div id="attView"><div id="attendance" class="attendance"></div><button id="done" class="done">DONE</button></div><div id="rosterView" class="roster hidden"><div class="note">Names remain only in this browser on this device. One student per line.</div><textarea id="roster" aria-label="Roster"></textarea><button id="saveRoster" class="done">SAVE ROSTER</button></div></section></main><script>
(()=>{const $=s=>document.querySelector(s), period=$('#period'), nameEl=$('#name'), stats=$('#stats'), panel=$('#panel'), att=$('#attendance'), roster=$('#roster');let picked=[],absent=new Set();const storageKey=p=>`selector_roster_p${p}`;const names=()=>{try{return JSON.parse(localStorage.getItem(storageKey(period.value))||'[]')}catch{return[]}};const present=()=>names().filter(n=>!absent.has(n));const remaining=()=>present().filter(n=>!picked.includes(n));function update(){const n=names(),p=present(),r=remaining();stats.textContent=n.length?`${r.length} left · ${p.length} present`:'Set roster';$('#pick').disabled=!p.length;$('#undo').disabled=!picked.length}function drawAttendance(){att.innerHTML='';const n=names();if(!n.length){const x=document.createElement('div');x.className='note';x.textContent='No roster for this period. Open Rosters to add names.';att.append(x);return}n.forEach(x=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=absent.has(x);c.onchange=()=>{c.checked?absent.add(x):absent.delete(x);picked=picked.filter(y=>!absent.has(y));update()};l.append(c,document.createTextNode(' '+x));att.append(l)})}function setPeriod(){picked=[];absent=new Set();nameEl.textContent='Ready';panel.classList.add('hidden');update()}period.onchange=setPeriod;$('#pick').onclick=()=>{let r=remaining();if(!r.length&&present().length){picked=[];r=remaining()}if(!r.length)return;const n=r[Math.floor(Math.random()*r.length)];picked.push(n);nameEl.textContent=n;update()};$('#undo').onclick=()=>{picked.pop();nameEl.textContent=picked.at(-1)||'Ready';update()};function openAtt(){panel.classList.remove('hidden');$('#attView').classList.remove('hidden');$('#rosterView').classList.add('hidden');drawAttendance()}$('#settings').onclick=openAtt;$('#attBtn').onclick=openAtt;$('#attTab').onclick=openAtt;$('#rosterTab').onclick=()=>{panel.classList.remove('hidden');$('#attView').classList.add('hidden');$('#rosterView').classList.remove('hidden');roster.value=names().join('\n')};$('#saveRoster').onclick=()=>{const a=roster.value.split(/\n+/).map(x=>x.trim()).filter(Boolean).filter((x,i,a)=>a.findIndex(y=>y.toLowerCase()===x.toLowerCase())===i);localStorage.setItem(storageKey(period.value),JSON.stringify(a));picked=[];absent=new Set();nameEl.textContent='Ready';openAtt();update()};$('#done').onclick=()=>panel.classList.add('hidden');update()})();
</script></body></html>
